<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/stylecont.css">
    <link rel="icon" type="image/png" href="imagens/logo-partiu-trip-grande-removebg-preview.png">
    <title>Contato • Partiu Trip</title>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo-area">
            <img id="logotipo" src="imagens/logo-partiu-trip-grande-removebg-preview.png" alt="logo Partiu Trip">
            <h1 class="titulo-site">Partiu Trip 🌎</h1>
        </div>

        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="viagens.html">Viagens</a></li>
                <li><a href="contato.html" class="ativo">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <section class="contato-container">

            <h2 class="titulo-contato">Entre em Contato ✉️</h2>
            <p class="texto-contato">
                Tem dúvidas, sugestões ou deseja planejar sua viagem dos sonhos?
                Fale com a gente! Estamos aqui para ajudar você a explorar o mundo 🌍✨
            </p>

            <!-- Formulário -->
            <form class="form-contato" action="#" method="POST">

                <label for="nome">Seu nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                <label for="email">Seu e-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem..." rows="6" required></textarea>

                <button type="submit" class="btn-contato">Enviar mensagem 🚀</button>
            </form>

        </section>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2025 PartiuTrip. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
